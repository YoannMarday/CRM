<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kikoo</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151c;--p:#1a1f2a;--p2:#222938;--ln:#2b3345;--tx:#e9eef5;--mu:#8b96a8;--mint:#9fd6cc;--amb:#e8b04b;--blu:#58a6e0;--pnk:#d9a7cf;--red:#ef7d7d;--r:16px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Fredoka','DM Sans',sans-serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--p);border-right:1px solid var(--ln);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-size:22px;padding:0 10px 18px;color:var(--mint)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:none;border:0;color:var(--mu);cursor:pointer;text-align:left;font-weight:500}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--mint);color:#0f2421}
main{padding:22px 26px 40px;min-width:0}
header{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.search{flex:1;background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;outline:0}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--mint)}
.btn{background:var(--mint);color:#0f2421;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.g{background:var(--p2);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:none;color:var(--red);border:1px solid var(--red)}
.btn.s{padding:6px 12px;font-size:13px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.gp{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:flex;gap:14px;align-items:center}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.stat b{font-size:24px;font-family:Fredoka;display:block;line-height:1.1}
.stat span{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row:hover{background:var(--p2)}
.row .m{flex:1;min-width:0}.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small,.mu{color:var(--mu);font-size:13px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;background:var(--p2)}
.s-Enquiry{color:var(--mu)}.s-Confirmed{color:var(--blu);background:#58a6e022}.s-In\ production{color:var(--amb);background:#e8b04b22}
.s-Ready{color:var(--mint);background:#9fd6cc22}.s-Delivered{color:var(--pnk);background:#d9a7cf22}.s-Closed{color:var(--mu)}
.late{color:var(--red);background:#ef7d7d22}.soon{color:var(--amb);background:#e8b04b22}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--p);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--mu)}
.tab.on{background:var(--mint);color:#0f2421;border-color:var(--mint);font-weight:700}
.rev{display:flex;gap:26px;margin-bottom:10px;flex-wrap:wrap}.rev b{font-size:22px;font-family:Fredoka;display:block}
.empty{color:var(--mu);padding:14px 4px}
.alert{background:#ef7d7d1f;border:1px solid #ef7d7d66;border-radius:14px;padding:12px 16px;margin-bottom:16px;color:var(--red)}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}
.box{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto}
.box h2{margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .w{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0;width:100%;color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--ln);margin:18px 0}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--mint);color:#0f2421;padding:8px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--p);border:1px solid var(--ln);border-radius:22px;padding:34px;width:min(360px,100%);display:grid;gap:14px;text-align:center}
#login .big{font-size:46px}
svg text{fill:var(--mu);font-size:11px;font-family:'DM Sans'}
@media(max-width:860px){
#app{grid-template-columns:1fr}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;border-top:1px solid var(--ln);border-right:0}
.logo{display:none}.nav{flex-direction:column;gap:2px;padding:7px 12px;font-size:12px}
main{padding:calc(14px + env(safe-area-inset-top)) 14px 100px}
.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.f{grid-template-columns:1fr}
}
#login .lg{width:150px;height:150px;border-radius:26px;margin:0 auto}
#login h1.logo{display:block!important;font-size:30px}
aside .logo{text-align:center;padding-bottom:14px}aside .logo img{display:block;width:120px;height:120px;border-radius:24px;margin:0 auto 6px}
.mbrand{display:none}
@media(max-width:860px){.mbrand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mbrand img{width:40px;height:40px;border-radius:10px}.mbrand b{font:600 22px 'Fredoka','DM Sans',sans-serif;color:var(--mint)}}
.rbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.rbar label{min-width:150px;flex:1 1 150px}.rbar .btn{flex:0 0 auto}
.rsum{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.rsum div{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;flex:1 1 120px}
.rsum b{display:block;font:600 19px 'Fredoka','DM Sans',sans-serif}.rsum small{color:var(--mu);font-size:12px}
.rt{border-collapse:collapse;width:100%;font-size:13px}.rt th,.rt td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}
.rt th{color:var(--mu);font-weight:600;background:var(--p2)}.rt .r{text-align:right}.rt tr:last-child td{border-bottom:0}
@media(max-width:860px){.nav{padding:7px 6px;font-size:11.5px}}
</style></head><body>
<div id="login" hidden><form onsubmit="return login(event)">
<img src="/logo.jpg" alt="Kikoo" class="lg"><h1 class="logo" style="padding:0">Kikoo</h1>
<input id="lu" placeholder="Username" autocomplete="username" required>
<input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
<button class="btn">Sign in</button><div id="le" class="mu"></div></form></div>
<div id="app" hidden>
<aside><div class="logo"><img src="/logo.jpg" alt="Kikoo"><span>Kikoo</span></div>
<button class="nav" data-v="dash" onclick="go('dash')">🏠 Dashboard</button>
<button class="nav" data-v="orders" onclick="go('orders')">📦 Orders</button>
<button class="nav" data-v="clients" onclick="go('clients')">👥 Clients</button>
<button class="nav" data-v="rep" onclick="go('rep')">📊 Report</button>
<button class="nav" data-v="set" onclick="go('set')">⚙️ Settings</button></aside>
<main><div class="mbrand"><img src="/logo.jpg" alt="Kikoo"><b>Kikoo</b></div><header><input class="search" id="q" placeholder="🔍 Search orders or clients…" oninput="q=this.value;if(view=='dash')view='orders';render()">
<button class="btn" onclick="oForm()">+ New order</button></header><section id="v"></section></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const CUR='Rs ',STG=['Enquiry','Confirmed','In production','Ready','Delivered','Closed'],TYP=['Personalised item','3D cut-out','Birthday deco','Mixed order'],PAY=['Cash','Bank transfer','Juice','Card','Other'];
let S={clients:[],orders:[],seq:1000,settings:{biz:'Kikoo'}},view='dash',q='',fl='All',rm='month',tm;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date());
const pd=s=>{const[y,m,d]=s.split('-');return new Date(y,m-1,d)},fmt=s=>s?pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const money=n=>CUR+Number(n||0).toLocaleString('en',{maximumFractionDigits:0}),uid=()=>Math.random().toString(36).slice(2,9);
const addD=(x,n)=>{const r=new Date(x);r.setDate(r.getDate()+n);return r},wk=d=>addD(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const cli=id=>S.clients.find(c=>c.id==id),ord=id=>S.orders.find(o=>o.id==id);
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');return d.length==8?'230'+d:d};
const paid=o=>o.payments.reduce((s,p)=>s+ +p.amount,0),bal=o=>(+o.amount||0)-paid(o);
const open_=o=>!['Delivered','Closed'].includes(o.status);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('on'),1400)}
async function save(){try{const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});if(r.status==401)return location.reload();toast('Saved ✓')}catch(e){toast('⚠️ Not saved – check connection')}}
async function boot(){const r=await fetch('/api/data');if(r.status==401){$('#login').hidden=false;return}const d=await r.json();S=Object.assign(S,d);S.settings=Object.assign({biz:'Kikoo'},S.settings);if(S.settings.biz=='My Party Studio')S.settings.biz='Kikoo';S.orders.forEach(o=>{o.payments=(o.payments||[]).filter(p=>+p.amount>0)});$('#login').hidden=true;$('#app').hidden=false;lastAct=lastPing=Date.now();render();loadLogo()}
async function login(e){e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#lu').value,pass:$('#lp').value})});if(r.ok)boot();else $('#le').textContent=(await r.json()).error||'Wrong username or password';return false}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function go(v){view=v;q='';$('#q').value='';render();if(v=='dash')popNd();else pushNd()}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v==view));$('#v').innerHTML=({dash,orders:ordersV,clients:clientsV,rep:repV,set:setV})[view]();scrollTo(0,0)}
const pill=o=>`<span class="pill s-${o.status}">${o.status}</span>`;
function dueTag(o){if(!o.deliveryDate||!open_(o))return'';const t=today();if(o.deliveryDate<t)return'<span class="pill late">Overdue</span>';if(o.deliveryDate==t)return'<span class="pill soon">Today</span>';if(o.deliveryDate<=iso(addD(new Date(),2)))return'<span class="pill soon">Soon</span>';return''}
const orow=o=>`<div class="row" onclick="oForm('${o.id}')"><div class="m"><b>${esc(o.title)}</b><small>${esc(cli(o.clientId)?.name||'?')} · #${o.no} · ${fmt(o.deliveryDate)}</small></div>${dueTag(o)}${o.priority!='Normal'?`<span class="pill soon">${o.priority}</span>`:''}<div style="text-align:right"><div>${pill(o)}</div>${bal(o)>0?`<small>Due ${money(bal(o))}</small>`:'<small>Paid ✓</small>'}</div></div>`;
function dash(){
const now=new Date(),t=today(),ws=wk(now),we=iso(addD(ws,6)),nwe=iso(addD(ws,13)),me=iso(new Date(now.getFullYear(),now.getMonth()+1,0)),nme=iso(new Date(now.getFullYear(),now.getMonth()+2,0));
const act=S.orders.filter(open_).sort((a,b)=>(a.deliveryDate||'9').localeCompare(b.deliveryDate||'9'));
const grp=o=>!o.deliveryDate?'Later':o.deliveryDate<t?'Overdue':o.deliveryDate<=we?'This week':o.deliveryDate<=nwe?'Next week':o.deliveryDate<=me?'Later this month':o.deliveryDate<=nme?'Next month':'Later';
const G=['Overdue','This week','Next week','Later this month','Next month'],pays=S.orders.flatMap(o=>o.payments);
const sum=(a,b)=>pays.filter(p=>p.date>=iso(a)&&p.date<=iso(b)).reduce((s,p)=>s+ +p.amount,0);
const y=now.getFullYear(),m=now.getMonth(),outst=S.orders.filter(o=>o.status!='Enquiry').reduce((s,o)=>s+Math.max(0,bal(o)),0);
const od=act.filter(o=>grp(o)=='Overdue').length,wkN=act.filter(o=>grp(o)=='This week').length;
let bars=[];
if(rm=='week')for(let i=7;i>=0;i--){const s=addD(ws,-7*i);bars.push([s.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),sum(s,addD(s,6))])}
else if(rm=='month')for(let i=11;i>=0;i--){const s=new Date(y,m-i,1);bars.push([s.toLocaleDateString('en-GB',{month:'short'}),sum(s,new Date(y,m-i+1,0))])}
else for(let i=4;i>=0;i--)bars.push([''+(y-i),sum(new Date(y-i,0,1),new Date(y-i,11,31))]);
const mx=Math.max(1,...bars.map(b=>b[1])),bw=600/bars.length;
const svg=`<svg viewBox="0 0 600 200" width="100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6cc"/><stop offset="1" stop-color="#9fd6cc" stop-opacity=".25"/></linearGradient></defs>${bars.map((b,i)=>{const h=b[1]/mx*150;return`<rect x="${i*bw+bw*.2}" y="${170-h}" width="${bw*.6}" height="${Math.max(h,2)}" rx="6" fill="${i==bars.length-1?'#e8b04b':'url(#gr)'}"><title>${b[0]}: ${money(b[1])}</title></rect><text x="${i*bw+bw/2}" y="190" text-anchor="middle">${b[0]}</text>`}).join('')}</svg>`;
const cs=S.clients.map(c=>({c,os:act.filter(o=>o.clientId==c.id)})).filter(x=>x.os.length).sort((a,b)=>(a.os[0].deliveryDate||'9').localeCompare(b.os[0].deliveryDate||'9'));
const st=(ic,col,v,l)=>`<div class="card stat"><div class="ic" style="background:${col}22">${ic}</div><div><b>${v}</b><span>${l}</span></div></div>`;
return`<h1 style="margin-bottom:4px">Hello! 👋</h1><p class="mu" style="margin-bottom:18px">${esc(S.settings.biz)} · ${now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p>
${od?`<div class="alert">⚠️ ${od} order${od>1?'s are':' is'} past the delivery date and not yet delivered.</div>`:''}
<div class="grid g4" style="margin-bottom:16px">${st('📦','#e8b04b',act.length,'Active orders')}${st('🚚','#9fd6cc',wkN,'Due this week')}${st('💰','#d9a7cf',money(outst),'Still to collect')}${st('📈','#58a6e0',money(sum(new Date(y,m,1),new Date(y,m+1,0))),'Received this month')}</div>
<div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>Revenue received <span class="tabs" style="margin:0">${['week','month','year'].map(k=>`<span class="tab ${rm==k?'on':''}" onclick="rm='${k}';render()">${k[0].toUpperCase()+k.slice(1)}s</span>`).join('')}</span></h3>
<div class="rev"><div><b>${money(sum(ws,addD(ws,6)))}</b><span class="mu">This week</span></div><div><b>${money(sum(new Date(y,m,1),new Date(y,m+1,0)))}</b><span class="mu">This month</span></div><div><b>${money(sum(new Date(y,0,1),new Date(y,11,31)))}</b><span class="mu">This year</span></div></div>${svg}</div>
<div class="card"><h3>Clients by priority</h3>${cs.length?cs.slice(0,6).map(x=>`<div class="row" onclick="cForm('${x.c.id}')"><div class="m"><b>${esc(x.c.name)}</b><small>Next: ${fmt(x.os[0].deliveryDate)} · ${x.os.length} order${x.os.length>1?'s':''}</small></div>${dueTag(x.os[0])}<small>${money(x.os.reduce((s,o)=>s+Math.max(0,bal(o)),0))}</small></div>`).join(''):'<div class="empty">No active clients yet. Add your first order!</div>'}</div></div>
<h2 style="margin:6px 0 12px">Coming up</h2><div class="grid gp">${G.map(g=>{const l=act.filter(o=>grp(o)==g);return l.length||g!='Overdue'?`<div class="card"><h3>${g}<span class="pill">${l.length}</span></h3>${l.length?l.map(orow).join(''):'<div class="empty">Nothing due 🎉</div>'}</div>`:''}).join('')}</div>`}
function ordersV(){
const k=q.toLowerCase(),l=S.orders.filter(o=>(fl=='All'||o.status==fl)&&(!k||(o.title+(cli(o.clientId)?.name||'')+o.details+'#'+o.no).toLowerCase().includes(k))).sort((a,b)=>(a.deliveryDate||'9').localeCompare(b.deliveryDate||'9'));
return`<h1 style="margin-bottom:14px">Orders</h1><div class="tabs">${['All',...STG].map(s=>`<span class="tab ${fl==s?'on':''}" onclick="fl='${s}';render()">${s}</span>`).join('')}</div><div class="card">${l.length?l.map(orow).join(''):'<div class="empty">No orders found.</div>'}</div>`}
function clientsV(){
const k=q.toLowerCase(),l=S.clients.filter(c=>!k||(c.name+c.phone+(c.child||'')).toLowerCase().includes(k)).sort((a,b)=>a.name.localeCompare(b.name));
return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h1>Clients</h1><button class="btn" onclick="cForm()">+ New client</button></div><div class="card">${l.length?l.map(c=>{const os=S.orders.filter(o=>o.clientId==c.id);return`<div class="row" onclick="cForm('${c.id}')"><div class="ic" style="background:#9fd6cc22;width:40px;height:40px">🎂</div><div class="m"><b>${esc(c.name)}</b><small>${esc(c.phone)}${c.child?' · '+esc(c.child):''}</small></div><small>${os.length} order${os.length!=1?'s':''}<br>${money(os.reduce((s,o)=>s+paid(o),0))} paid</small></div>`}).join(''):'<div class="empty">No clients yet.</div>'}</div>`}
function setV(){return`<h1 style="margin-bottom:14px">Settings</h1><div class="card" style="max-width:520px"><form id="f" onsubmit="return saveSet(event)" class="f"><div class="w">${fld('Business name (shown on receipts)','biz',S.settings.biz)}</div></form><div class="acts"><button class="btn" onclick="saveSet()">Save</button></div><hr><h3>Backup</h3><p class="mu">Download a copy of all your data now and then, and keep it safe.</p><div class="acts"><button class="btn g" onclick="backup()">⬇️ Download backup</button><label class="btn g" style="cursor:pointer;color:var(--tx)">⬆️ Restore backup<input type="file" accept=".json" hidden onchange="restore(this)"></label></div><hr><button class="btn d" onclick="logout()">Sign out</button></div>`}
function saveSet(e){e&&e.preventDefault();S.settings.biz=$('#f [name=biz]').value||'Kikoo';save();render();return false}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='party-crm-backup-'+today()+'.json';a.click()}
function restore(i){const f=i.files[0];if(!f||!confirm('This replaces ALL current data. Continue?'))return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.clients||!d.orders)throw 0;S=d;save();render()}catch(e){alert('That file is not a valid backup.')}})}
const fld=(l,n,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,o,v,x='')=>`<label>${l}<select name="${n}" ${x}>${o.map(a=>{const[k,t]=Array.isArray(a)?a:[a,a];return`<option value="${esc(k)}"${k==v?' selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
const fd=()=>Object.fromEntries(new FormData($('#f'))),mdl=h=>{pushNd();$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)cm()"><div class="box">${h}</div></div>`},cm=()=>{$('#modal').innerHTML='';popNd()};
function cForm(id){const c=cli(id)||{},os=id?S.orders.filter(o=>o.clientId==id):[];

let LOGO=null;const LOGO_PX=720;
function loadLogo(){fetch('/logo-receipt.jpg').then(r=>r.arrayBuffer()).then(b=>{LOGO=new Uint8Array(b)}).catch(()=>{})}
const pdfStr=s=>String(s==null?'':s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F\u200D]/gu,'').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function receiptPdf(o,c,p,i){
  const W=420,H=595,M=40,ops=[],biz=S.settings.biz||'Kikoo',own=/^\s*kikoo\s*$/i.test(biz),no=`R-${o.no}-${i+1}`;
  const T=(t,x,top,size,bold,col)=>ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${col||'0.1 0.1 0.1 rg'} ${x} ${H-top} Td (${pdfStr(t)}) Tj ET`);
  const hr=top=>ops.push(`0.75 G 0.7 w ${M} ${H-top} m ${W-M} ${H-top} l S`),GR='0.45 0.45 0.45 rg';
  if(LOGO)ops.push(`q 170 0 0 170 ${(W-170)/2} ${H-28-170} cm /Im1 Do Q`);
  let t=222;if(!own){T(biz,M,t,13,1);t+=22}
  T('Payment receipt '+no,M,t,16,1);t+=18;T(fmt(p.date),M,t,11,0,GR);t+=14;hr(t);t+=26;
  T('Received from',M,t,10,0,GR);t+=17;T(c.name,M,t,15,1);t+=26;
  T('For',M,t,10,0,GR);t+=17;T(`${o.title} (Order #${o.no})`,M,t,12);t+=44;
  T(money(p.amount),M,t,28,1,'0.07 0.45 0.85 rg');t+=24;T('Method: '+p.method,M,t,11,0,GR);t+=18;hr(t);t+=26;
  T('Order total',M,t,12);T(money(o.amount),200,t,12);t+=18;
  T('Paid to date',M,t,12);T(money(paid(o)),200,t,12);t+=18;
  T('Balance',M,t,13,1);T(money(bal(o)),200,t,13,1);t+=38;
  T('Thank you!',M,t,14,1);
  return buildPdf(ops.join('\n'),W,H);
}
function buildPdf(content,W,H){
  const enc=s=>{const a=new Uint8Array(s.length);for(let k=0;k<s.length;k++)a[k]=s.charCodeAt(k)&255;return a};
  const chunks=[],offs=[];let pos=0;const add=x=>{const a=typeof x=='string'?enc(x):x;chunks.push(a);pos+=a.length};
  const obj=(n,body)=>{offs[n]=pos;add(`${n} 0 obj\n${body}\nendobj\n`)};
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >>${LOGO?' /XObject << /Im1 6 0 R >>':''} >> /Contents 7 0 R >>`);
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(5,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if(LOGO){offs[6]=pos;add(`6 0 obj\n<< /Type /XObject /Subtype /Image /Width ${LOGO_PX} /Height ${LOGO_PX} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${LOGO.length} >>\nstream\n`);add(LOGO);add('\nendstream\nendobj\n')}
  else obj(6,'null');
  obj(7,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xr=pos;add('xref\n0 8\n0000000000 65535 f \n');for(let n=1;n<=7;n++)add(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const out=new Uint8Array(pos);let at=0;chunks.forEach(a=>{out.set(a,at);at+=a.length});return out;
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const pdates=(o,by)=>by=='ord'?[o.orderDate||o.deliveryDate]:by=='del'?[o.deliveryDate||o.orderDate]:[o.orderDate,o.deliveryDate];
function repRows(by){

  const key=o=>(by=='del'?(o.deliveryDate||o.orderDate):(o.orderDate||o.deliveryDate))||'9999';
  const os=S.orders.filter(o=>rp.mode=='all'||pdates(o,by).some(hit));
  os.sort((a,b)=>key(a).localeCompare(key(b))||(a.no-b.no));
  return os.map(o=>{const c=cli(o.clientId)||{},tot=+o.amount||0,pd_=paid(o);
    return{date:o.orderDate||'',ddate:o.deliveryDate||'',no:o.no,name:c.name||'',phone:c.phone||'',addr:o.addr||c.addr||'',title:o.title||'',total:tot,paid:pd_,due:tot-pd_,del:delivered(o)}});

${rp.mode!='all'&&rp.by=='any'?'<small style="display:block;margin-top:10px;color:var(--mu)">An order appears in a month if its order date or its delivery date falls in that month, so an order placed in one month and delivered in the next shows in both.</small>':''}</div>

const xe=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function zipStore(files){
  const te=new TextEncoder(),T=[];for(let k=0;k<256;k++){let c=k;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[k]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts=[],cd=[];let off=0;
  files.forEach(f=>{const nm=te.encode(f.name),c=crc(f.data),L=new DataView(new ArrayBuffer(30));
    L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint16(6,0x0800,true);L.setUint16(8,0,true);L.setUint16(10,dt,true);L.setUint16(12,dd,true);L.setUint32(14,c,true);L.setUint32(18,f.data.length,true);L.setUint32(22,f.data.length,true);L.setUint16(26,nm.length,true);L.setUint16(28,0,true);
    parts.push(new Uint8Array(L.buffer),nm,f.data);
    const C=new DataView(new ArrayBuffer(46));C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint16(8,0x0800,true);C.setUint16(10,0,true);C.setUint16(12,dt,true);C.setUint16(14,dd,true);C.setUint32(16,c,true);C.setUint32(20,f.data.length,true);C.setUint32(24,f.data.length,true);C.setUint16(28,nm.length,true);C.setUint32(42,off,true);
    cd.push(new Uint8Array(C.buffer),nm);off+=30+nm.length+f.data.length});
  const size=cd.reduce((s,a)=>s+a.length,0),E=new DataView(new ArrayBuffer(22));
  E.setUint32(0,0x06054b50,true);E.setUint16(8,files.length,true);E.setUint16(10,files.length,true);E.setUint32(12,size,true);E.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(E.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ---- phone back button: first press returns to the dashboard ---- */
const nd=()=>history.state&&history.state.nd;
function pushNd(){if(!nd())history.pushState({nd:1},'')}
function popNd(){if(view=='dash'&&nd())history.back()}
addEventListener('popstate',()=>{if($('#app').hidden)return;cm();view='dash';q='';$('#q').value='';render()});

/* ---- auto log-off after 5 minutes without activity ---- */
const IDLE=5*60000;let lastAct=Date.now(),lastPing=Date.now();
function act(){if($('#app').hidden)return;const n=Date.now();if(n-lastAct>IDLE)return logout();lastAct=n;
  if(n-lastPing>60000){lastPing=n;fetch('/api/ping',{method:'POST'}).then(r=>{if(r.status==401)location.reload()}).catch(()=>{})}}
['click','keydown','input','touchstart','pointerdown','scroll','mousemove'].forEach(e=>addEventListener(e,act,{passive:true,capture:true}));
setInterval(()=>{if(!$('#app').hidden&&Date.now()-lastAct>IDLE)logout()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden&&Date.now()-lastAct>IDLE)logout()});

boot();
