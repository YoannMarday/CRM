services:
  - type: web
    name: finance-ops-app
    env: node
    plan: free
    buildCommand: cd server && npm install && node setup.js
    startCommand: cd server && node index.js
    envVars:
      # Paste your Neon connection link here in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
