services:
  - type: web
    name: party-crm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_USER
        sync: false
      - key: APP_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
